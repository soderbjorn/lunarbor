<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2a2f5a"/>
      <stop offset="1" stop-color="#11142b"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="24" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="34" cy="40" r="1.5"/><circle cx="70" cy="22" r="1"/><circle cx="250" cy="30" r="1.6"/>
    <circle cx="272" cy="90" r="1"/><circle cx="22" cy="120" r="1.2"/><circle cx="210" cy="60" r="0.9"/>
    <circle cx="48" cy="210" r="1"/><circle cx="268" cy="200" r="1.3"/>
  </g>
  <!-- cushion -->
  <ellipse cx="150" cy="262" rx="110" ry="20" fill="#6c4ab6"/>
  <ellipse cx="150" cy="256" rx="104" ry="16" fill="#8a67d6"/>
  <!-- tail -->
  <path d="M205 245 C 255 245, 262 200, 240 175 C 232 166, 222 172, 230 182 C 245 200, 238 228, 200 232 Z" fill="#f08a2c"/>
  <path d="M236 178 l8 -2 M246 196 l9 1 M244 216 l9 4" stroke="#c4621a" stroke-width="5" stroke-linecap="round"/>
  <!-- body -->
  <path d="M95 250 C 85 190, 105 140, 150 135 C 195 140, 215 190, 205 250 Z" fill="#f59a3c"/>
  <path d="M120 250 C 118 205, 130 175, 150 172 C 170 175, 182 205, 180 250 Z" fill="#ffe2bf"/>
  <!-- body stripes -->
  <g stroke="#c4621a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M100 200 q 10 -4 16 4"/><path d="M98 222 q 10 -4 18 4"/>
    <path d="M200 200 q -10 -4 -16 4"/><path d="M202 222 q -10 -4 -18 4"/>
  </g>
  <!-- paws -->
  <ellipse cx="130" cy="252" rx="17" ry="10" fill="#ffe2bf"/>
  <ellipse cx="170" cy="252" rx="17" ry="10" fill="#ffe2bf"/>
  <path d="M124 252 v6 M131 252 v7 M138 252 v6 M164 252 v6 M171 252 v7 M178 252 v6" stroke="#e0b98c" stroke-width="2"/>
  <!-- collar -->
  <path d="M112 148 Q 150 168 188 148" stroke="#3b6fd8" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- original 4-point star pin -->
  <g transform="translate(150 162)">
    <circle r="11" fill="#ffd34d" stroke="#b8860b" stroke-width="2"/>
    <path d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4 Z" fill="#fff8d6"/>
  </g>
  <!-- head -->
  <path d="M98 78 L 92 30 L 128 58 Z" fill="#f59a3c"/>
  <path d="M202 78 L 208 30 L 172 58 Z" fill="#f59a3c"/>
  <path d="M100 68 L 98 42 L 118 58 Z" fill="#ffb3b3"/>
  <path d="M200 68 L 202 42 L 182 58 Z" fill="#ffb3b3"/>
  <ellipse cx="150" cy="100" rx="62" ry="54" fill="#f59a3c"/>
  <!-- forehead stripes (tabby M) -->
  <g stroke="#c4621a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M150 50 v16"/><path d="M136 53 l4 14"/><path d="M164 53 l-4 14"/>
    <path d="M90 96 h14"/><path d="M92 110 h12"/><path d="M210 96 h-14"/><path d="M208 110 h-12"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="150" cy="122" rx="30" ry="20" fill="#ffe2bf"/>
  <!-- eyes (sleepy-happy) -->
  <g fill="#2b2b2b">
    <ellipse cx="124" cy="96" rx="10" ry="12"/>
    <ellipse cx="176" cy="96" rx="10" ry="12"/>
  </g>
  <g fill="#fff">
    <circle cx="127" cy="91" r="3.5"/><circle cx="179" cy="91" r="3.5"/>
    <circle cx="121" cy="101" r="1.6"/><circle cx="173" cy="101" r="1.6"/>
  </g>
  <!-- blush -->
  <ellipse cx="108" cy="118" rx="9" ry="5" fill="#ff8c8c" opacity="0.6"/>
  <ellipse cx="192" cy="118" rx="9" ry="5" fill="#ff8c8c" opacity="0.6"/>
  <!-- nose & mouth -->
  <path d="M144 113 h12 l-6 7 z" fill="#ff7b9c"/>
  <path d="M150 120 q -6 9 -13 4 M150 120 q 6 9 13 4" stroke="#7a3b1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M118 120 l-36 -6"/><path d="M118 126 l-36 2"/>
    <path d="M182 120 l36 -6"/><path d="M182 126 l36 2"/>
  </g>
  <text x="150" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cfc6ff">Spot · Chief Napping Officer</text>
</svg>
