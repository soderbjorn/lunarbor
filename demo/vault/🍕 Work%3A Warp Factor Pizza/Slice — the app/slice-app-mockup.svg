<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="warp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#9b5bff"/>
    </linearGradient>
    <clipPath id="screen"><rect x="14" y="14" width="332" height="692" rx="38"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <!-- phone body -->
  <rect x="2" y="2" width="356" height="716" rx="50" fill="#1b1b22"/>
  <rect x="6" y="6" width="348" height="708" rx="46" fill="#2a2a33"/>
  <g clip-path="url(#screen)">
    <rect x="14" y="14" width="332" height="692" fill="#f7f4f0"/>
    <!-- hero header -->
    <path d="M14 14 H346 V230 Q180 262 14 230 Z" fill="url(#hero)"/>
    <!-- tiny stars in header -->
    <g fill="#fff" opacity="0.7">
      <circle cx="60" cy="70" r="1.4"/><circle cx="290" cy="64" r="1.8"/><circle cx="250" cy="110" r="1"/>
      <circle cx="40" cy="150" r="1.2"/><circle cx="318" cy="170" r="1.1"/><circle cx="120" cy="58" r="0.9"/>
    </g>
    <!-- status bar -->
    <text x="38" y="40" font-size="12" font-weight="600" fill="#fff">9:41</text>
    <rect x="148" y="24" width="64" height="20" rx="10" fill="#000"/>
    <g fill="#fff"><rect x="290" y="31" width="22" height="10" rx="2.5"/><rect x="313" y="34" width="2" height="4" rx="1"/></g>
    <!-- title -->
    <text x="34" y="86" font-size="13" fill="#ffe0d2" letter-spacing="1.5">GOOD EVENING, MAYA</text>
    <text x="34" y="114" font-size="25" font-weight="800" fill="#fff">Warp Factor Pizza</text>
    <!-- ETA chip -->
    <rect x="34" y="128" width="148" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="50" cy="142" r="4" fill="#7dffb0"/>
    <text x="61" y="147" font-size="13" font-weight="600" fill="#fff">Warp 9 · 12 min</text>
    <!-- engage button -->
    <g filter="url(#sh)">
      <rect x="34" y="172" width="292" height="56" rx="28" fill="#fff"/>
    </g>
    <text x="180" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#c2185b">Engage 🍕</text>
    <!-- section title -->
    <text x="34" y="282" font-size="17" font-weight="700" fill="#22202a">Tonight's menu</text>
    <text x="326" y="282" text-anchor="end" font-size="13" fill="#c2185b">See all</text>
    <!-- card 1 -->
    <g filter="url(#sh)"><rect x="30" y="298" width="300" height="88" rx="18" fill="#fff"/></g>
    <circle cx="74" cy="342" r="30" fill="#f2c27b"/><circle cx="74" cy="342" r="24" fill="#d9a35a"/>
    <g fill="#6b4a2f"><circle cx="64" cy="334" r="5"/><circle cx="82" cy="338" r="4"/><circle cx="70" cy="354" r="4.5"/><circle cx="86" cy="352" r="3.5"/></g>
    <text x="118" y="334" font-size="15" font-weight="700" fill="#22202a">Tribble Truffle</text>
    <text x="118" y="352" font-size="12" fill="#77727f">Fluffy, purring, multiplies in oven</text>
    <text x="118" y="373" font-size="14" font-weight="700" fill="#c2185b">$14.99</text>
    <circle cx="306" cy="362" r="13" fill="#c2185b"/><path d="M306 356 v12 M300 362 h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- card 2 -->
    <g filter="url(#sh)"><rect x="30" y="398" width="300" height="88" rx="18" fill="#fff"/></g>
    <circle cx="74" cy="442" r="30" fill="#f2c27b"/><circle cx="74" cy="442" r="24" fill="#e2563a"/>
    <g fill="#9c1f1f"><circle cx="64" cy="434" r="5.5"/><circle cx="84" cy="436" r="5"/><circle cx="70" cy="454" r="5"/><circle cx="88" cy="452" r="4"/></g>
    <text x="118" y="434" font-size="15" font-weight="700" fill="#22202a">Plomeek Pepperoni</text>
    <text x="118" y="452" font-size="12" fill="#77727f">Logically delicious. Mildly spicy.</text>
    <text x="118" y="473" font-size="14" font-weight="700" fill="#c2185b">$13.49</text>
    <circle cx="306" cy="462" r="13" fill="#c2185b"/><path d="M306 456 v12 M300 462 h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- card 3 -->
    <g filter="url(#sh)"><rect x="30" y="498" width="300" height="88" rx="18" fill="#fff"/></g>
    <circle cx="74" cy="542" r="30" fill="#f2c27b"/><circle cx="74" cy="542" r="24" fill="#f4d58d"/>
    <path d="M56 530 q 18 10 36 0 M56 546 q 18 10 36 0" stroke="#d68a1c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="118" y="534" font-size="15" font-weight="700" fill="#22202a">Earl Grey Hot-Honey</text>
    <text x="118" y="552" font-size="12" fill="#77727f">Tea-infused crust. Served hot.</text>
    <text x="118" y="573" font-size="14" font-weight="700" fill="#c2185b">$15.99</text>
    <rect x="232" y="562" width="44" height="18" rx="9" fill="#ffe8a3"/><text x="254" y="575" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a00">NEW</text>
    <circle cx="306" cy="562" r="13" fill="#c2185b"/><path d="M306 556 v12 M300 562 h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- warp progress -->
    <rect x="30" y="602" width="300" height="8" rx="4" fill="#e9e4ef"/>
    <rect x="30" y="602" width="210" height="8" rx="4" fill="url(#warp)"/>
    <text x="30" y="626" font-size="11" fill="#77727f">Next order: 2 slices until free Tribble</text>
    <!-- bottom nav -->
    <rect x="14" y="638" width="332" height="68" fill="#fff"/>
    <line x1="14" y1="638" x2="346" y2="638" stroke="#eee6ee"/>
    <g font-size="10" text-anchor="middle">
      <path d="M58 650 l12 -9 l12 9 v12 h-24 z" fill="#c2185b"/>
      <text x="70" y="676" fill="#c2185b" font-weight="700">Home</text>
      <circle cx="137" cy="654" r="8" fill="none" stroke="#9a96a3" stroke-width="2"/><path d="M143 660 l6 6" stroke="#9a96a3" stroke-width="2" stroke-linecap="round"/>
      <text x="140" y="676" fill="#9a96a3">Search</text>
      <path d="M204 646 h20 l-3 16 h-14 z" fill="none" stroke="#9a96a3" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="226" cy="645" r="6" fill="#c2185b"/><text x="226" y="648.5" fill="#fff" font-size="8" font-weight="700">2</text>
      <text x="214" y="676" fill="#9a96a3">Cart</text>
      <circle cx="290" cy="650" r="5" fill="none" stroke="#9a96a3" stroke-width="2"/><path d="M280 664 q 10 -10 20 0" fill="none" stroke="#9a96a3" stroke-width="2"/>
      <text x="290" y="676" fill="#9a96a3">Crew</text>
    </g>
    <rect x="130" y="690" width="100" height="4" rx="2" fill="#22202a"/>
  </g>
</svg>
